name: Notify Parent Repo

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger parent update
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PARENT_TOKEN }}" \
            https://api.github.com/repos/HugueLiu/HugueLiu.github.io/dispatches \
            -d '{"event_type":"submodule-updated"}'
